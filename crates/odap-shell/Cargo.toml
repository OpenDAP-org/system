[package]
name = "odap-shell"
version = "0.0.1"
description = "Blackbird OS compositor and system layers (bring-up)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
opendap-device.workspace = true
opendap-splash.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
smithay = { workspace = true, features = [
    "backend_drm",
    "backend_gbm",
    "backend_libinput",
    "backend_udev",
    "backend_session_libseat",
    "desktop",
    "renderer_gl",
    "wayland_frontend",
] }
tracing-journald.workspace = true
# Smithay's event loop, with its signal source (SIGTERM: hand the display over before exiting).
calloop = { version = "0.14", features = ["signals"] }
# The system layers, drawn by Slint's software renderer into a buffer the compositor places above
# every client (ADR 0002, spec §7).
slint = { workspace = true, features = ["std", "compat-1-2", "renderer-software"] }

[build-dependencies]
opendap-workspace.workspace = true
slint-build.workspace = true
