[package]
name = "odap-testbed"
version = "0.0.1"
description = "The UI primitives activity of Blackbird OS (SYS-071): a developer activity that exercises the UI primitives, one screen each"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
opendap-device.workspace = true
opendap-input.workspace = true
opendap-layout.workspace = true
opendap-media.workspace = true
opendap-motion.workspace = true
# The same renderers as the product host, so the testbed exercises the same paths.
slint = { workspace = true, features = ["std", "compat-1-2", "backend-winit", "renderer-femtovg", "renderer-software", "accessibility"] }
# See odap-product: holds zbus's thread pool below 1.7.0 (smol-rs/blocking#83).
blocking = ">=1.6.2, <1.7"

[build-dependencies]
opendap-workspace.workspace = true
slint-build.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
