[package]
name = "odap-product"
version = "0.0.1"
description = "Blackbird OS product host: Now Playing, Library, Sound and This device (bring-up)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
# FemtoVG on a GPU, the software renderer where there is none (selected at run time).
slint = { workspace = true, features = ["std", "compat-1-2", "backend-winit", "renderer-femtovg", "renderer-software", "accessibility"] }
# Not used directly: holds the thread pool behind zbus (Slint's accessibility) below 1.7.0, whose
# idle threads never exit and wake twice a second for ever (smol-rs/blocking#83; #75 changed the exit
# condition), failing the idle-wakeup gate (composer spec 5.1). Lift once upstream restores the exit.
blocking = ">=1.6.2, <1.7"

[build-dependencies]
opendap-workspace.workspace = true
slint-build.workspace = true
